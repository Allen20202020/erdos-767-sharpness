name: Proof verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          auto-config: false
          build: true
          leanchecker: true
          axiom-audit: true
          axiom-audit-root: JSP628
          nanoda: true
          nanoda-allow-sorry: false
      - name: Expanded statement and six axiom closures
        run: lake env lean -DwarningAsError=true Audit.lean
